version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: journey-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: journey
      MYSQL_USER: journey
      MYSQL_PASSWORD: journey123
    ports:
      - "3307:3306"        # 3307 agar tidak bentrok dengan MySQL lokal
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: journey-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "mysql://journey:journey123@db:3306/journey"
      JWT_SECRET: "your-super-secret-jwt-key-change-this"
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: "http://localhost:5173"
    volumes:
      - ./server/uploads:/app/uploads    # persist uploaded screenshots
      - ./server/logs:/app/logs          # persist logs
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: journey-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000"
      VITE_WS_URL: "ws://localhost:5000"
    depends_on:
      - server

volumes:
  db_data: